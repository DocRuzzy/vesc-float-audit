# Fungineers Thor 301 (Board A).
# Every value is {value, evidence, source}. Evidence labels:
#   Source     confirmed in pinned upstream source during this work
#   Dev        documented by the vendor/author, not re-read here
#   UNVERIFIED not confirmed from a primary source
id: thor301
name: Fungineers Thor 301
fw_hw_name: {value: Thor301, evidence: Source, source: "https://github.com/vedderb/bldc/blob/e877eaead23e23cc0e160302d75554eaeb2c98d0/hwconf/fungineers/301/hw_Thor301.h#L23"}

